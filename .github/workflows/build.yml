# iStoreOS x86 云端编译 + 自动 Release
#
# 触发方式:
#   1) 手动: GitHub Actions -> Build iStoreOS x86 -> Run workflow
#      (可填 release_tag, 默认 latest-x86; 同名 Release 会被更新而不是新建)
#   2) 自动: push 形如 v* 的 tag 时, 用该 tag 创建/更新 Release
#
# 运行器: ubuntu-24.04 (pinned)
# 构建:   make defconfig (seed .config) -> make -j$(nproc) V=s
# 产物:   bin/targets/x86/64/ 下 istoreos-x86-64-generic-*.img.gz
# 校验:   目标/profile 选择检查 + 产物存在性检查 + sha256sum -c sha256sums
# 发布:   仅当 build 作业全部成功时, release 作业才执行 (needs + if success)

name: Build iStoreOS x86

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (留空默认 latest-x86, 已存在则更新)"
        required: false
        default: "latest-x86"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build-x86
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make libncurses-dev flex bison gawk \
            findutils devscripts diffstat quilt libssl-dev libelf-dev \
            zlib1g-dev liblzma-dev libzstd-dev libexpat-dev pkg-config

      - name: Seed minimal .config (x86/64 generic)
        run: |
          printf '%s\n' \
            'CONFIG_TARGET_x86=y' \
            'CONFIG_TARGET_x86_64=y' \
            'CONFIG_TARGET_x86_64_DEVICE_generic=y' \
            > .config

      - name: Generate full config (make defconfig)
        run: make defconfig V=s

      - name: Verify target & profile selection
        run: |
          grep -q '^CONFIG_TARGET_x86_64=y$' .config || { echo "::error::x86_64 target 未被选中"; exit 1; }
          grep -q '^CONFIG_TARGET_x86_64_DEVICE_generic=y$' .config || { echo "::error::generic profile 未被选中"; exit 1; }
          grep -q '^CONFIG_TARGET_IMAGES_GZIP=y$' .config || { echo "::error::镜像 gzip 开关异常"; exit 1; }
          echo "=== 选中的 target 相关配置 ==="
          grep -E '^CONFIG_TARGET' .config | sed -n '1,20p'

      - name: Build (make -j$(nproc))
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build_full.log
          rc=${PIPESTATUS[0]}
          echo "=== make exit code: $rc ==="
          exit "$rc"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed
          path: build_full.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify artifacts exist
        run: |
          BIN=bin/targets/x86/64
          test -f "$BIN/istoreos-x86-64-generic-combined.img.gz"      || { echo "::error::缺少 combined.img.gz"; exit 1; }
          test -f "$BIN/istoreos-x86-64-generic-combined-efi.img.gz"  || { echo "::error::缺少 combined-efi.img.gz"; exit 1; }
          test -f "$BIN/istoreos-x86-64-generic-rootfs.img.gz"       || { echo "::error::缺少 rootfs.img.gz"; exit 1; }
          test -f "$BIN/sha256sums"                                 || { echo "::error::缺少 sha256sums"; exit 1; }
          test -f "$BIN/profiles.json"                              || { echo "::error::缺少 profiles.json"; exit 1; }
          echo "=== bin/targets/x86/64 ==="
          ls -lh "$BIN" | grep -E 'img\.gz|sha256sums|profiles\.json'

      - name: Verify checksums (sha256sum -c)
        working-directory: bin/targets/x86/64
        run: |
          sha256sum -c sha256sums
          echo "=== 校验通过 ==="
          sha256sum -c <(grep -E 'istoreos-x86-64-generic-(combined|combined-efi|rootfs)\.img\.gz$' sha256sums)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-x86-64
          path: |
            bin/targets/x86/64/istoreos-x86-64-generic-*.img.gz
            bin/targets/x86/64/sha256sums
            bin/targets/x86/64/profiles.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: publish-release
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: istoreos-x86-64
          path: release-files

      - name: Generate release body
        id: body
        run: |
          OUT="$RUNNER_TEMP/release-body.md"
          {
            echo "iStoreOS x86_64 (generic) — 由 GitHub Actions 构建并发布"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch/Ref: \`${{ github.ref_name }}\`"
            echo "- 构建作业: [${{ github.workflow_run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.workflow_run_id }})"
            echo ""
            echo "## 附件校验 (sha256sum -c sha256sums 已在构建中通过)"
            echo ""
            echo '```'
            ls -l release-files | awk '{print $5, $9}' | sed 's/^/  /'
            echo '```'
            echo ""
            echo "sha256sums:"
            echo '```'
            cat release-files/sha256sums
            echo '```'
          } > "$OUT"
          BODY=$(cat "$OUT")
          echo "body<<RELEASE_BODY_EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$BODY" >> "$GITHUB_OUTPUT"
          echo "RELEASE_BODY_EOF" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: iStoreOS x86_64 ${{ github.event.inputs.release_tag || github.ref_name }}
          body: ${{ steps.body.outputs.body }}
          files: release-files/*
          fail_on_unmatched_files: true
          delete_other_files: false
          generate_release_notes: false
          prerelease: false
          draft: false
